name: horariomedicoturnil
description: "HorarioMedicoTurnil - App movil que enlaza el wearable BLE con el servidor y la TV."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.32.11
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/alert.wav
    - assets/lottie/pulso.json
